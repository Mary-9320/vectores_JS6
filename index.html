<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurisdicción Sanitaria No. 6 - Productividad</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .section-card {
            transition: transform 0.2s ease, shadow 0.2s ease;
        }
        .section-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="pb-20">

    <!-- Header Institucional -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-5 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="flex items-center gap-4">
                <div class="bg-orange-500 p-3 rounded-2xl text-white shadow-orange-200 shadow-lg">
                    <i data-lucide="building-2" size="28"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight leading-none uppercase">Jurisdicción Sanitaria No. 6</h1>
                    <p class="text-[11px] font-bold text-sky-600 uppercase mt-2 tracking-[0.15em]">Unidad de Control de Vectores</p>
                </div>
            </div>
            
            <div class="relative group w-full md:w-96">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="18"></i>
                <input 
                    type="text" 
                    id="searchInput"
                    placeholder="Buscar personal..."
                    class="pl-11 pr-5 py-3 bg-slate-100 border-2 border-transparent rounded-2xl text-sm focus:bg-white focus:border-sky-400 focus:ring-4 focus:ring-sky-50 w-full outline-none transition-all font-medium"
                >
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-8">
        
        <!-- Resumen Superior -->
        <div id="statsGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-12">
            <!-- Cargado dinámicamente -->
        </div>

        <!-- Contenedor de Secciones -->
        <div id="sectionsContainer">
            <!-- Cargado dinámicamente -->
        </div>

        <!-- Pie de página -->
        <div class="mt-12 pt-8 border-t border-slate-200 text-center">
            <div class="flex justify-center gap-2 items-center mb-3">
                <div class="w-1.5 h-1.5 rounded-full bg-orange-500"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-sky-500"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-300"></div>
            </div>
            <p class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.2em]">
                Sistema Integral de Monitoreo • Jurisdicción Sanitaria 6 • 2026
            </p>
        </div>
    </main>

    <script>
        // Datos con ortografía corregida
        const rawData = [
            { nombre: "ALCOCER MACÍAS GERARDO", cl: 61, rc: 2, neb: 1, ee: 0, ov: 0 },
            { nombre: "BARRIENTOS SALINAS MARTHA ALEJANDRA", cl: 0, rc: 0, neb: 0, ee: 0, ov: 132 },
            { nombre: "COLCHADO CASTAÑEDA JORGE ISIDRO", cl: 45, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "FLORES MARTÍNEZ SILVIA ELIZABETH", cl: 44, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "FLORES RUIZ JORGE LUIS", cl: 57, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "GARCÍA SILVA DIMAS", cl: 0, rc: 0, neb: 0, ee: 0, ov: 104 },
            { nombre: "GARZA CÁZARES JUAN JESÚS", cl: 12, rc: 0, neb: 0, ee: 27, ov: 0 },
            { nombre: "GARZA BARRERA SEFERINO", cl: 63, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "GARZA CORONADO BEATRIZ ALEJANDRA", cl: 67, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "GARZA MARTÍNEZ PERLA ESMERALDA", cl: 0, rc: 0, neb: 0, ee: 0, ov: 72 },
            { nombre: "HERNÁNDEZ ORTEGÓN JULIÁN", cl: 0, rc: 0, neb: 34, ee: 0, ov: 0 },
            { nombre: "ISAAC SANTOS XÓCHITL LETICIA", cl: 0, rc: 0, neb: 0, ee: 0, ov: 104 },
            { nombre: "LLANES MENDOZA ANTONIO TADEO", cl: 96, rc: 0, neb: 0, ee: 30, ov: 0 },
            { nombre: "LÓPEZ RAMÍREZ MIRIAM SUSANA", cl: 10, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "LOREDO LUCERO ESMERALDA", cl: 40, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "MARTÍNEZ MORENO LIZETH", cl: 128, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "MUÑOZ GONZÁLEZ JOSÉ DOMINGO", cl: 36, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "PADILLA GARZA MARÍA DEL REFUGIO", cl: 0, rc: 0, neb: 0, ee: 0, ov: 104 },
            { nombre: "RODRÍGUEZ FABELA CECILIA GECELY", cl: 0, rc: 0, neb: 0, ee: 77, ov: 0 },
            { nombre: "SALAZAR LÓPEZ MYRIAM", cl: 30, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "SÁNCHEZ MENDOZA FRANCISCA LIZETH", cl: 21, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "TIJERINA GONZÁLEZ ALFREDO", cl: 55, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "TIJERINA GONZÁLEZ RODRIGO SAMUEL", cl: 56, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "VELOZ PINALES JOSÉ ADRIÁN", cl: 6, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "VILLARREAL GUEVARA EDNA LIZBETH", cl: 12, rc: 0, neb: 0, ee: 0, ov: 0 },
            { nombre: "ZÁRATE HERNÁNDEZ MARÍA LUISA", cl: 0, rc: 0, neb: 0, ee: 0, ov: 104 },
        ];

        const brigadasCL = {
            "BRIGADA JS6": [
                "ALCOCER MACÍAS GERARDO", "FLORES MARTÍNEZ SILVIA ELIZABETH", 
                "GARZA CORONADO BEATRIZ ALEJANDRA", "MARTÍNEZ MORENO LIZETH", 
                "TIJERINA GONZÁLEZ ALFREDO", "VELOZ PINALES JOSÉ ADRIÁN", 
                "FLORES RUIZ JORGE LUIS"
            ],
            "BRIGADA LÁZARO CÁRDENAS": [
                "COLCHADO CASTAÑEDA JORGE ISIDRO", "GARZA CÁZARES JUAN JESÚS", 
                "GARZA BARRERA SEFERINO", "MUÑOZ GONZÁLEZ JOSÉ DOMINGO"
            ],
            "C.S. CARLOS SALINAS DE GORTARI": [
                "LLANES MENDOZA ANTONIO TADEO"
            ]
        };

        const sectionsDef = [
            { id: 'cl', label: 'Control Larvario', unit: 'Casas', icon: 'home', color: 'sky', bg: 'bg-sky-500', text: 'text-sky-600', light: 'bg-sky-50', border: 'border-sky-200' },
            { id: 'ov', label: 'Ovitrampas', unit: 'Ovitrampas', icon: 'layers', color: 'orange', bg: 'bg-orange-500', text: 'text-orange-600', light: 'bg-orange-50', border: 'border-orange-200' },
            { id: 'neb', label: 'Nebulización', unit: 'Manzanas', icon: 'wind', color: 'sky', bg: 'bg-sky-600', text: 'text-sky-700', light: 'bg-sky-50', border: 'border-sky-200' },
            { id: 'ee', label: 'Estudio Entomológico', unit: 'Casas', icon: 'bug', color: 'orange', bg: 'bg-orange-600', text: 'text-orange-700', light: 'bg-orange-50', border: 'border-orange-200' }
        ];

        let currentSearch = "";

        function init() {
            lucide.createIcons();
            render();
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                currentSearch = e.target.value.toLowerCase();
                render();
            });
        }

        function render() {
            renderStats();
            renderSections();
            lucide.createIcons();
        }

        function renderStats() {
            const statsGrid = document.getElementById('statsGrid');
            statsGrid.innerHTML = "";
            
            sectionsDef.forEach(s => {
                const total = rawData.reduce((acc, curr) => acc + (curr[s.id] || 0), 0);
                statsGrid.innerHTML += `
                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 relative overflow-hidden group hover:shadow-lg transition-all">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">${s.label}</p>
                        <div class="flex items-baseline gap-2">
                            <p class="text-2xl font-black ${s.text}">${total.toLocaleString()}</p>
                            <span class="text-[9px] text-slate-400 font-bold uppercase">${s.unit}</span>
                        </div>
                        <div class="h-1 w-10 ${s.bg} rounded-full mt-3"></div>
                    </div>
                `;
            });
        }

        function renderSections() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = "";

            const filtered = rawData.filter(d => d.nombre.toLowerCase().includes(currentSearch));

            sectionsDef.forEach(section => {
                const sectionData = filtered.filter(d => d[section.id] > 0);
                if (sectionData.length === 0 && currentSearch !== "") return;

                if (section.id === 'cl') {
                    renderCLSection(container, section, sectionData);
                } else {
                    renderGenericSection(container, section, sectionData);
                }
            });
        }

        function renderCLSection(container, section, data) {
            const total = data.reduce((acc, curr) => acc + curr.cl, 0);
            
            const groups = {
                "BRIGADA JS6": [],
                "BRIGADA LÁZARO CÁRDENAS": [],
                "C.S. CARLOS SALINAS DE GORTARI": [],
                "FORÁNEOS": []
            };

            data.forEach(p => {
                if (brigadasCL["BRIGADA JS6"].includes(p.nombre)) groups["BRIGADA JS6"].push(p);
                else if (brigadasCL["BRIGADA LÁZARO CÁRDENAS"].includes(p.nombre)) groups["BRIGADA LÁZARO CÁRDENAS"].push(p);
                else if (brigadasCL["C.S. CARLOS SALINAS DE GORTARI"].includes(p.nombre)) groups["C.S. CARLOS SALINAS DE GORTARI"].push(p);
                else groups["FORÁNEOS"].push(p);
            });

            let groupsHtml = "";
            Object.entries(groups).forEach(([name, members]) => {
                if (members.length === 0) return;
                const groupTotal = members.reduce((a, b) => a + b.cl, 0);
                
                groupsHtml += `
                    <div class="bg-slate-50/50 border border-slate-100 rounded-2xl overflow-hidden transition-all hover:bg-white hover:shadow-md">
                        <div class="bg-white px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <i data-lucide="map-pin" class="${section.text} w-3.5 h-3.5"></i>
                                <h3 class="text-[11px] font-black text-slate-700 uppercase tracking-tight">${name}</h3>
                            </div>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-lg ${section.light} ${section.text}">
                                ${groupTotal} Atendidas
                            </span>
                        </div>
                        <div class="p-2">
                            <table class="w-full text-left text-[11px]">
                                <tbody class="divide-y divide-slate-100">
                                    ${members.sort((a,b) => b.cl - a.cl).map(m => `
                                        <tr class="group">
                                            <td class="px-3 py-2 text-slate-600 font-medium group-hover:text-slate-900 leading-tight">${m.nombre}</td>
                                            <td class="px-3 py-2 text-right font-black text-slate-800">${m.cl}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML += `
                <div class="mb-12 bg-white rounded-2xl shadow-sm border ${section.border} overflow-hidden section-card">
                    <div class="${section.light} px-6 py-4 border-b ${section.border} flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="${section.bg} p-2.5 rounded-xl text-white shadow-lg">
                                <i data-lucide="${section.icon}" size="22"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold ${section.text}">${section.label}</h2>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Productividad por Brigada</p>
                            </div>
                        </div>
                        <div class="bg-white/80 backdrop-blur px-5 py-2 rounded-2xl border border-white shadow-sm">
                            <p class="text-[9px] text-slate-400 font-black uppercase text-right">Total General</p>
                            <p class="text-xl font-black ${section.text}">${total.toLocaleString()} <span class="text-xs font-medium">Casas</span></p>
                        </div>
                    </div>
                    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${groupsHtml}
                    </div>
                </div>
            `;
        }

        function renderGenericSection(container, section, data) {
            const total = data.reduce((acc, curr) => acc + curr[section.id], 0);
            
            container.innerHTML += `
                <div class="mb-12 bg-white rounded-2xl shadow-sm border ${section.border} overflow-hidden section-card">
                    <div class="${section.light} px-6 py-4 border-b ${section.border} flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-3">
                            <div class="${section.bg} p-2.5 rounded-xl text-white shadow-lg">
                                <i data-lucide="${section.icon}" size="22"></i>
                            </div>
                            <h2 class="text-xl font-bold ${section.text}">${section.label}</h2>
                        </div>
                        <div class="bg-white/80 px-5 py-2 rounded-2xl border border-white shadow-sm">
                            <p class="text-[9px] text-slate-400 font-black uppercase text-center">Total ${section.unit}</p>
                            <p class="text-xl font-black ${section.text} text-center">${total.toLocaleString()}</p>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="overflow-x-auto rounded-xl border border-slate-100">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50/50">
                                    <tr>
                                        <th class="px-6 py-3 text-[10px] font-black text-slate-400 uppercase">Nombre Completo del Personal</th>
                                        <th class="px-6 py-3 text-[10px] font-black text-slate-400 uppercase text-right">Cant. (${section.unit})</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-50">
                                    ${data.sort((a,b) => b[section.id] - a[section.id]).map(row => `
                                        <tr class="hover:bg-slate-50/50 transition-colors">
                                            <td class="px-6 py-3 text-xs font-semibold text-slate-700 leading-tight">${row.nombre}</td>
                                            <td class="px-6 py-3 text-sm text-right font-black text-slate-900">
                                                <span class="${section.light} ${section.text} px-3 py-1 rounded-lg">${row[section.id]}</span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Iniciar al cargar
        window.onload = init;
    </script>
</body>

</html>
